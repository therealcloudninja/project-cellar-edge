[project]
name = "edge-collector"
version = "0.1.0"
description = "Edge telemetry collector for wine storage monitoring"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]

[tool.black]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
